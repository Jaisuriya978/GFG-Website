<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Learn Coding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #111;
            color: #e5e7eb;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            color: #22c55e;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-card p {
            font-size: 14px;
            color: #9ca3af;
        }

        .form-control {
            background: #020617;
            border: 1px solid #1e293b;
            color: #e5e7eb;
        }

        .form-control:focus {
            background: #020617;
            border-color: #22c55e;
            box-shadow: none;
            color: #e5e7eb;
        }

        .btn-login {
            background: #22c55e;
            color: #022c22;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-login:hover {
            background: #16a34a;
            color: #022c22;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #64748b;
            font-size: 14px;
        }

        .extra-links a {
            color: #22c55e;
            text-decoration: none;
            font-size: 14px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="text-center">Welcome Back 👋</h2>
    <p class="text-center">Login to continue learning</p>

    <form>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <a href="forgotpassword.html" class="extra-links">Forgot password?</a>
        </div>

        <button type="button" class="btn btn-login w-100 py-2"
        onclick="window.location.href='index.html'">
            Login
        </button>


        <div class="divider">OR</div>

        <div class="text-center extra-links">
            <p>Don't have an account?
                <a href="register.html">Create one</a>
            </p>
        </div>
    </form>
</div>

</body>
</html>
