<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Learn Coding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            background: #111;
            color: #e5e7eb;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .register-card h2 {
            color: #22c55e;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .register-card p {
            font-size: 14px;
            color: #9ca3af;
        }

        .form-control {
            background: #020617;
            border: 1px solid #1e293b;
            color: #e5e7eb;
        }

        .form-control:focus {
            background: #020617;
            border-color: #22c55e;
            box-shadow: none;
            color: #e5e7eb;
        }

        .btn-register {
            background: #22c55e;
            color: #022c22;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-register:hover {
            background: #16a34a;
            color: #022c22;
        }

        .extra-links a {
            color: #22c55e;
            text-decoration: none;
            font-size: 14px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .terms {
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2 class="text-center">Create Account 🚀</h2>
    <p class="text-center">Start your learning journey today</p>

    <form>
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Create a password" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" placeholder="Confirm password" required>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label terms" for="terms">
                I agree to the <a href="#" class="extra-links">Terms & Conditions</a>
            </label>
        </div>

        <button type="submit" class="btn btn-register w-100 py-2" onclick="window.location.href='login.html'">
            Create Account
        </button>


        <div class="text-center mt-3 extra-links">
            <p>Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </form>
</div>

</body>
</html>
